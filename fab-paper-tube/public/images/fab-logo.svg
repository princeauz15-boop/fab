<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Outer light blue circle background -->
  <circle cx="200" cy="200" r="195" fill="#e8f4ff" stroke="#c0d8f0" stroke-width="2"/>
  
  <!-- ── GOLD PAPER TUBES (bar chart style) ── -->
  <!-- Tube 1 - far left short -->
  <ellipse cx="100" cy="148" rx="18" ry="9" fill="#d4a020"/>
  <rect x="82" y="148" width="36" height="70" fill="#e8b830"/>
  <ellipse cx="100" cy="218" rx="18" ry="9" fill="#c89010"/>
  <!-- Tube 2 -->
  <ellipse cx="138" cy="128" rx="18" ry="9" fill="#d4a020"/>
  <rect x="120" y="128" width="36" height="90" fill="#f0c840"/>
  <ellipse cx="138" cy="218" rx="18" ry="9" fill="#c89010"/>
  <!-- Tube 3 center-left tall -->
  <ellipse cx="176" cy="100" rx="18" ry="9" fill="#d4a020"/>
  <rect x="158" y="100" width="36" height="118" fill="#e8b830"/>
  <ellipse cx="176" cy="218" rx="18" ry="9" fill="#c89010"/>
  <!-- Tube 4 center tall -->
  <ellipse cx="214" cy="88" rx="18" ry="9" fill="#d4a020"/>
  <rect x="196" y="88" width="36" height="130" fill="#f0c840"/>
  <ellipse cx="214" cy="218" rx="18" ry="9" fill="#c89010"/>
  <!-- Tube 5 -->
  <ellipse cx="252" cy="110" rx="18" ry="9" fill="#d4a020"/>
  <rect x="234" y="110" width="36" height="108" fill="#e8b830"/>
  <ellipse cx="252" cy="218" rx="18" ry="9" fill="#c89010"/>
  <!-- Tube 6 right -->
  <ellipse cx="290" cy="135" rx="18" ry="9" fill="#d4a020"/>
  <rect x="272" y="135" width="36" height="83" fill="#f0c840"/>
  <ellipse cx="290" cy="218" rx="18" ry="9" fill="#c89010"/>

  <!-- ── BLUE GROWTH ARROW ── -->
  <polyline points="88,210 140,175 190,150 240,120 295,85" 
    stroke="#1a5fbf" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow head -->
  <polygon points="295,85 278,88 285,105" fill="#1a5fbf"/>

  <!-- ── BLUE BOWL / BASE PLATFORM ── -->
  <path d="M70,222 Q195,260 330,222" stroke="#1a5fbf" stroke-width="5" fill="none"/>
  <path d="M70,222 Q90,250 110,255 Q195,275 290,255 Q310,250 330,222 Q270,238 195,238 Q120,238 70,222 Z" fill="#1a5fbf" opacity="0.15"/>

  <!-- ── TWO BLUE CARTOON FIGURES ── -->
  <!-- Left figure -->
  <!-- Head -->
  <circle cx="158" cy="270" r="22" fill="#2266cc"/>
  <!-- Smile -->
  <path d="M148,275 Q158,284 168,275" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Eyes -->
  <ellipse cx="151" cy="267" rx="4" ry="4.5" fill="white"/>
  <ellipse cx="165" cy="267" rx="4" ry="4.5" fill="white"/>
  <circle cx="152" cy="268" r="2.5" fill="#1a1a6e"/>
  <circle cx="166" cy="268" r="2.5" fill="#1a1a6e"/>
  <!-- Eyebrows happy arch -->
  <path d="M147,262 Q151,258 155,262" stroke="#1a1a6e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M161,262 Q165,258 169,262" stroke="#1a1a6e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Body -->
  <path d="M138,292 Q120,320 125,350 L192,350 Q196,320 178,292 Z" fill="#2266cc"/>
  <!-- Thumbs up arm -->
  <path d="M138,292 Q115,285 105,275" stroke="#2266cc" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Thumb up hand -->
  <circle cx="103" cy="272" r="10" fill="#2266cc"/>
  <rect x="97" y="255" width="10" height="18" rx="5" fill="#2266cc"/>

  <!-- Right figure (with tie) -->
  <!-- Head -->
  <circle cx="242" cy="270" r="22" fill="#2266cc"/>
  <!-- Smile -->
  <path d="M232,275 Q242,284 252,275" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Eyes -->
  <ellipse cx="235" cy="267" rx="4" ry="4.5" fill="white"/>
  <ellipse cx="249" cy="267" rx="4" ry="4.5" fill="white"/>
  <circle cx="236" cy="268" r="2.5" fill="#1a1a6e"/>
  <circle cx="250" cy="268" r="2.5" fill="#1a1a6e"/>
  <!-- Eyebrows happy -->
  <path d="M231,262 Q235,258 239,262" stroke="#1a1a6e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M245,262 Q249,258 253,262" stroke="#1a1a6e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Body -->
  <path d="M222,292 Q204,320 208,350 L276,350 Q280,320 262,292 Z" fill="#2266cc"/>
  <!-- Tie -->
  <polygon points="242,295 237,308 242,340 247,308" fill="#1a3a8a"/>
  <polygon points="237,295 247,295 245,303 239,303" fill="#1a3a8a"/>
  <!-- Handshake arm -->
  <path d="M262,292 Q285,285 295,275" stroke="#2266cc" stroke-width="14" fill="none" stroke-linecap="round"/>
  <circle cx="297" cy="272" r="10" fill="#2266cc"/>

  <!-- ── HANDSHAKE HANDS IN CENTER ── -->
  <ellipse cx="200" cy="300" rx="20" ry="12" fill="#2266cc" opacity="0.8"/>
  <path d="M180,300 Q200,290 220,300" stroke="#3377dd" stroke-width="3" fill="none"/>

  <!-- ── FAB TEXT ── -->
  <text x="200" y="375" font-family="Arial Black, Arial" font-weight="900" font-size="42" fill="#1a3a8a" text-anchor="middle" letter-spacing="3">FAB</text>
  <text x="200" y="393" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#1a3a8a" text-anchor="middle" letter-spacing="2">PAPER TUBE</text>

  <!-- ── CURVED TAGLINE AT BOTTOM ── -->
  <defs>
    <path id="bottomArc" d="M 55,200 A 145,145 0 0,0 345,200"/>
  </defs>
  <text font-family="Arial, sans-serif" font-size="11" fill="#1a3a8a" font-style="italic">
    <textPath href="#bottomArc" startOffset="8%">"Premium and Sustainable Packaging Solutions"</textPath>
  </text>

  <!-- Outer ring border -->
  <circle cx="200" cy="200" r="193" fill="none" stroke="#1a5fbf" stroke-width="3"/>
</svg>
