<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600">
<defs>

  <!-- ── Light blue background circle gradient ── -->
  <radialGradient id="bgGrad" cx="38%" cy="32%" r="68%">
    <stop offset="0%"   stop-color="#e8f4ff"/>
    <stop offset="55%"  stop-color="#c0dcf8"/>
    <stop offset="100%" stop-color="#8ab8e8"/>
  </radialGradient>

  <!-- ── Gold tube body gradient (left-dark, center-bright, right-dark) ── -->
  <linearGradient id="gTube" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#8a5800"/>
    <stop offset="20%"  stop-color="#d48c00"/>
    <stop offset="40%"  stop-color="#f8c820"/>
    <stop offset="55%"  stop-color="#ffd830"/>
    <stop offset="70%"  stop-color="#f0b010"/>
    <stop offset="85%"  stop-color="#d08000"/>
    <stop offset="100%" stop-color="#8a5800"/>
  </linearGradient>

  <!-- ── Gold top ellipse ── -->
  <radialGradient id="gTop" cx="40%" cy="40%" r="60%">
    <stop offset="0%"   stop-color="#ffe060"/>
    <stop offset="100%" stop-color="#c88010"/>
  </radialGradient>

  <!-- ── Gold bottom ellipse ── -->
  <radialGradient id="gBot" cx="50%" cy="30%" r="70%">
    <stop offset="0%"   stop-color="#b07010"/>
    <stop offset="100%" stop-color="#603000"/>
  </radialGradient>

  <!-- ── Arrow blue gradient ── -->
  <linearGradient id="arrG" x1="0%" y1="100%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#1040b0"/>
    <stop offset="50%"  stop-color="#2878e8"/>
    <stop offset="100%" stop-color="#50a8ff"/>
  </linearGradient>

  <!-- ── Bowl gradient ── -->
  <linearGradient id="bowlG" x1="0%" y1="0%" x2="20%" y2="100%">
    <stop offset="0%"   stop-color="#3070d8"/>
    <stop offset="100%" stop-color="#08205a"/>
  </linearGradient>

  <!-- ── Figure blue gradient (3D sphere look) ── -->
  <radialGradient id="figG" cx="35%" cy="30%" r="65%">
    <stop offset="0%"   stop-color="#70c8ff"/>
    <stop offset="45%"  stop-color="#1a80e8"/>
    <stop offset="100%" stop-color="#0840a8"/>
  </radialGradient>

  <!-- ── Figure head highlight ── -->
  <radialGradient id="figH" cx="30%" cy="25%" r="60%">
    <stop offset="0%"   stop-color="#90d8ff"/>
    <stop offset="50%"  stop-color="#2090f0"/>
    <stop offset="100%" stop-color="#0850c0"/>
  </radialGradient>

  <!-- ── FAB text gradient ── -->
  <linearGradient id="fabG" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#2060d0"/>
    <stop offset="100%" stop-color="#08205a"/>
  </linearGradient>

  <!-- ── Tagline arc path ── -->
  <path id="tagPath" d="M 68,490 A 195,195 0 0,0 452,490"/>

</defs>

<!-- ══════════════════════════════════════════════════════════
     OUTER DARK RING  (the thick dark border seen in logo)
════════════════════════════════════════════════════════════ -->
<circle cx="260" cy="235" r="218" fill="#08194a" opacity="0.18"/>
<circle cx="260" cy="235" r="214" fill="none" stroke="#0a2060" stroke-width="4"/>

<!-- ══════════════════════════════════════════════════════════
     BACKGROUND CIRCLE
════════════════════════════════════════════════════════════ -->
<circle cx="260" cy="235" r="210" fill="url(#bgGrad)"/>
<circle cx="260" cy="235" r="206" fill="none" stroke="white" stroke-width="3" opacity="0.55"/>

<!-- ══════════════════════════════════════════════════════════
     GOLD 3-D PAPER TUBES  (bar-chart, tallest center)
     Each tube = rect body + top ellipse cap + top hollow
════════════════════════════════════════════════════════════ -->

<!-- tube macro: x  yTop  w  h -->

<!-- T1 far-left short -->
<rect   x="72"  y="188" width="30" height="90"   fill="url(#gTube)"/>
<ellipse cx="87"  cy="188" rx="15"  ry="7.5" fill="url(#gTop)"/>
<ellipse cx="87"  cy="278" rx="15"  ry="7.5" fill="url(#gBot)"/>
<ellipse cx="87"  cy="188" rx="8"   ry="4"   fill="#1a0800" opacity=".72"/>

<!-- T2 -->
<rect   x="106" y="162" width="32" height="116"  fill="url(#gTube)"/>
<ellipse cx="122" cy="162" rx="16"  ry="8"   fill="url(#gTop)"/>
<ellipse cx="122" cy="278" rx="16"  ry="8"   fill="url(#gBot)"/>
<ellipse cx="122" cy="162" rx="9"   ry="4.5" fill="#1a0800" opacity=".72"/>

<!-- T3 tall-left -->
<rect   x="142" y="130" width="34" height="148"  fill="url(#gTube)"/>
<ellipse cx="159" cy="130" rx="17"  ry="8.5" fill="url(#gTop)"/>
<ellipse cx="159" cy="278" rx="17"  ry="8.5" fill="url(#gBot)"/>
<ellipse cx="159" cy="130" rx="9.5" ry="4.8" fill="#1a0800" opacity=".72"/>

<!-- T4 tallest center-left -->
<rect   x="180" y="100" width="36" height="178"  fill="url(#gTube)"/>
<ellipse cx="198" cy="100" rx="18"  ry="9"   fill="url(#gTop)"/>
<ellipse cx="198" cy="278" rx="18"  ry="9"   fill="url(#gBot)"/>
<ellipse cx="198" cy="100" rx="10"  ry="5"   fill="#1a0800" opacity=".72"/>

<!-- T5 tallest center -->
<rect   x="220" y="92"  width="36" height="186"  fill="url(#gTube)"/>
<ellipse cx="238" cy="92"  rx="18"  ry="9"   fill="url(#gTop)"/>
<ellipse cx="238" cy="278" rx="18"  ry="9"   fill="url(#gBot)"/>
<ellipse cx="238" cy="92"  rx="10"  ry="5"   fill="#1a0800" opacity=".72"/>

<!-- T6 center-right -->
<rect   x="260" y="108" width="34" height="170"  fill="url(#gTube)"/>
<ellipse cx="277" cy="108" rx="17"  ry="8.5" fill="url(#gTop)"/>
<ellipse cx="277" cy="278" rx="17"  ry="8.5" fill="url(#gBot)"/>
<ellipse cx="277" cy="108" rx="9.5" ry="4.8" fill="#1a0800" opacity=".72"/>

<!-- T7 right -->
<rect   x="298" y="138" width="32" height="140"  fill="url(#gTube)"/>
<ellipse cx="314" cy="138" rx="16"  ry="8"   fill="url(#gTop)"/>
<ellipse cx="314" cy="278" rx="16"  ry="8"   fill="url(#gBot)"/>
<ellipse cx="314" cy="138" rx="9"   ry="4.5" fill="#1a0800" opacity=".72"/>

<!-- T8 short right -->
<rect   x="334" y="170" width="30" height="108"  fill="url(#gTube)"/>
<ellipse cx="349" cy="170" rx="15"  ry="7.5" fill="url(#gTop)"/>
<ellipse cx="349" cy="278" rx="15"  ry="7.5" fill="url(#gBot)"/>
<ellipse cx="349" cy="170" rx="8"   ry="4"   fill="#1a0800" opacity=".72"/>

<!-- T9 far-right shortest -->
<rect   x="368" y="200" width="24" height="78"   fill="url(#gTube)"/>
<ellipse cx="380" cy="200" rx="12"  ry="6"   fill="url(#gTop)"/>
<ellipse cx="380" cy="278" rx="12"  ry="6"   fill="url(#gBot)"/>
<ellipse cx="380" cy="200" rx="6.5" ry="3.2" fill="#1a0800" opacity=".72"/>

<!-- ══════════════════════════════════════════════════════════
     BLUE GROWTH ARROW  (bold, white inner line, 3-D effect)
════════════════════════════════════════════════════════════ -->
<!-- drop shadow -->
<polyline points="75,270 130,232 190,205 250,168 320,130 385,82"
  stroke="#06144a" stroke-width="12" fill="none"
  stroke-linecap="round" stroke-linejoin="round" opacity=".30"/>
<!-- main arrow body -->
<polyline points="75,270 130,232 190,205 250,168 320,130 385,82"
  stroke="url(#arrG)" stroke-width="9" fill="none"
  stroke-linecap="round" stroke-linejoin="round"/>
<!-- white shine -->
<polyline points="75,270 130,232 190,205 250,168 320,130 385,82"
  stroke="white" stroke-width="2.5" fill="none"
  stroke-linecap="round" stroke-linejoin="round" opacity=".45"/>
<!-- arrowhead -->
<polygon points="385,82 362,96 374,114" fill="url(#arrG)"/>
<polygon points="385,82 362,96 374,114" fill="none" stroke="white" stroke-width="1.5" opacity=".5"/>

<!-- ══════════════════════════════════════════════════════════
     BLUE 3-D BOWL / PLATFORM
════════════════════════════════════════════════════════════ -->
<!-- bowl body -->
<path d="M 55,288 Q 260,345 465,288 Q 400,328 260,338 Q 120,328 55,288 Z"
  fill="url(#bowlG)" opacity=".93"/>
<!-- rim highlight -->
<path d="M 57,286 Q 260,340 463,286"
  stroke="#60a0ff" stroke-width="3.5" fill="none" opacity=".65"/>
<path d="M 57,286 Q 260,340 463,286"
  stroke="white" stroke-width="1.2" fill="none" opacity=".35"/>

<!-- ══════════════════════════════════════════════════════════
     LEFT FIGURE  — happy, THUMBS UP
════════════════════════════════════════════════════════════ -->
<!-- BODY -->
<ellipse cx="168" cy="332" rx="44" ry="58" fill="url(#figG)"/>
<ellipse cx="154" cy="314" rx="18" ry="26" fill="white" opacity=".18"/><!-- body shine -->

<!-- HEAD -->
<circle cx="168" cy="270" r="40" fill="url(#figH)"/>
<circle cx="152" cy="257" r="16" fill="white" opacity=".22"/><!-- head shine -->

<!-- eyes (closed, happy arcs) -->
<path d="M 154,268 Q 158,262 162,268" stroke="#0a1840" stroke-width="3.2" fill="none" stroke-linecap="round"/>
<path d="M 174,268 Q 178,262 182,268" stroke="#0a1840" stroke-width="3.2" fill="none" stroke-linecap="round"/>
<!-- smile -->
<path d="M 152,282 Q 168,296 184,282" stroke="#0a1840" stroke-width="2.8" fill="none" stroke-linecap="round"/>
<!-- blush cheeks -->
<ellipse cx="142" cy="280" rx="10" ry="6.5" fill="#ff6666" opacity=".30"/>
<ellipse cx="194" cy="280" rx="10" ry="6.5" fill="#ff6666" opacity=".30"/>

<!-- LEFT ARM raised (thumb up direction) -->
<ellipse cx="112" cy="310" rx="18" ry="32" fill="url(#figG)" transform="rotate(-38,112,310)"/>
<!-- Hand -->
<circle cx="88" cy="282" r="20" fill="url(#figH)"/>
<!-- Thumb -->
<rect x="78" y="256" width="18" height="28" rx="9" fill="url(#figH)"/>
<rect x="80" y="258" width="7"  height="13" rx="3.5" fill="white" opacity=".28"/>

<!-- RIGHT ARM (shake direction) -->
<ellipse cx="210" cy="342" rx="16" ry="30" fill="url(#figG)" transform="rotate(28,210,342)"/>

<!-- ══════════════════════════════════════════════════════════
     RIGHT FIGURE  — TIE, happy, shake
════════════════════════════════════════════════════════════ -->
<!-- BODY -->
<ellipse cx="352" cy="332" rx="44" ry="58" fill="url(#figG)"/>
<ellipse cx="338" cy="314" rx="18" ry="26" fill="white" opacity=".18"/>

<!-- TIE -->
<polygon points="352,302 345,320 352,368 359,320" fill="#1030a8"/>
<polygon points="345,302 359,302 357,316 347,316" fill="#08185a"/>
<!-- tie shine -->
<rect x="350" y="306" width="4" height="16" rx="2" fill="white" opacity=".20"/>

<!-- HEAD -->
<circle cx="352" cy="270" r="40" fill="url(#figH)"/>
<circle cx="336" cy="257" r="16" fill="white" opacity=".22"/>

<!-- eyes -->
<path d="M 338,268 Q 342,262 346,268" stroke="#0a1840" stroke-width="3.2" fill="none" stroke-linecap="round"/>
<path d="M 358,268 Q 362,262 366,268" stroke="#0a1840" stroke-width="3.2" fill="none" stroke-linecap="round"/>
<!-- smile -->
<path d="M 336,282 Q 352,296 368,282" stroke="#0a1840" stroke-width="2.8" fill="none" stroke-linecap="round"/>
<!-- blush -->
<ellipse cx="326" cy="280" rx="10" ry="6.5" fill="#ff6666" opacity=".30"/>
<ellipse cx="378" cy="280" rx="10" ry="6.5" fill="#ff6666" opacity=".30"/>

<!-- LEFT ARM (shake) -->
<ellipse cx="310" cy="342" rx="16" ry="30" fill="url(#figG)" transform="rotate(-28,310,342)"/>

<!-- RIGHT ARM -->
<ellipse cx="408" cy="310" rx="18" ry="32" fill="url(#figG)" transform="rotate(38,408,310)"/>

<!-- ══════════════════════════════════════════════════════════
     HANDSHAKE  (center)
════════════════════════════════════════════════════════════ -->
<!-- left hand -->
<circle cx="230" cy="358" r="22" fill="url(#figH)"/>
<!-- right hand -->
<circle cx="290" cy="358" r="22" fill="url(#figH)"/>
<!-- clasp overlap -->
<ellipse cx="260" cy="358" rx="38" ry="19" fill="url(#figG)"/>
<!-- knuckle lines -->
<path d="M 234,352 Q 260,344 286,352" stroke="white" stroke-width="2" fill="none" opacity=".30"/>
<path d="M 232,360 Q 260,352 288,360" stroke="white" stroke-width="1.5" fill="none" opacity=".22"/>

<!-- ══════════════════════════════════════════════════════════
     FAB  TEXT
════════════════════════════════════════════════════════════ -->
<!-- shadow layer -->
<text x="263" y="427" font-family="Arial Black,Impact,sans-serif" font-weight="900"
  font-size="95" fill="#060e38" text-anchor="middle" opacity=".28" dx="4" dy="4">FAB</text>
<!-- main text -->
<text x="260" y="424" font-family="Arial Black,Impact,sans-serif" font-weight="900"
  font-size="95" fill="url(#fabG)" text-anchor="middle">FAB</text>
<!-- white stroke outline for depth -->
<text x="260" y="424" font-family="Arial Black,Impact,sans-serif" font-weight="900"
  font-size="95" fill="none" stroke="white" stroke-width="1.8"
  text-anchor="middle" opacity=".40">FAB</text>

<!-- PAPER TUBE sub-text -->
<text x="260" y="452" font-family="Arial,Helvetica,sans-serif" font-weight="700"
  font-size="26" fill="#1040b8" text-anchor="middle" letter-spacing="7">PAPER TUBE</text>

<!-- ══════════════════════════════════════════════════════════
     CURVED TAGLINE
════════════════════════════════════════════════════════════ -->
<!-- subtle band behind tagline -->
<path d="M 62,482 Q 260,568 458,482 Q 460,502 452,510 Q 260,598 68,510 Q 60,502 62,482 Z"
  fill="#1040b8" opacity=".08"/>
<!-- tagline text -->
<text font-family="Georgia,Times New Roman,serif" font-size="18" fill="#0a2878"
  font-style="italic" font-weight="600">
  <textPath href="#tagPath" startOffset="5%">
    "Premium and Sustainable Packaging Solutions"
  </textPath>
</text>

<!-- ══════════════════════════════════════════════════════════
     OUTER ARC RING  (dark bottom arc matching logo)
════════════════════════════════════════════════════════════ -->
<!-- top arc (lighter) -->
<path d="M 46,235 A 215,215 0 0,1 474,235"
  fill="none" stroke="#90b8e0" stroke-width="2.5" opacity=".55"/>
<!-- bottom dark arc -->
<path d="M 46,235 A 215,215 0 0,0 474,235"
  fill="none" stroke="#0a1848" stroke-width="4.5"/>

</svg>
