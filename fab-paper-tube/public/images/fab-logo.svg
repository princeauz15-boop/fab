<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ddeeff"/>
      <stop offset="100%" stop-color="#aaccee"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#b8780a"/>
      <stop offset="30%"  stop-color="#f5c030"/>
      <stop offset="60%"  stop-color="#e8a010"/>
      <stop offset="100%" stop-color="#b8780a"/>
    </linearGradient>
    <linearGradient id="goldT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fdd060"/>
      <stop offset="100%" stop-color="#c89018"/>
    </linearGradient>
    <linearGradient id="goldB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#a06010"/>
      <stop offset="100%" stop-color="#704008"/>
    </linearGradient>
    <linearGradient id="blue1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#60c0ff"/>
      <stop offset="50%"  stop-color="#1a7ee0"/>
      <stop offset="100%" stop-color="#0a40a0"/>
    </linearGradient>
    <linearGradient id="blue2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#80d8ff"/>
      <stop offset="100%" stop-color="#1060c8"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#2060c8"/>
      <stop offset="100%" stop-color="#082060"/>
    </linearGradient>
    <linearGradient id="fabg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1a5ad8"/>
      <stop offset="100%" stop-color="#082070"/>
    </linearGradient>
    <linearGradient id="arr" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1050b8"/>
      <stop offset="100%" stop-color="#4090ff"/>
    </linearGradient>
    <path id="tagArc" d="M 22,115 A 85,85 0 0,0 178,115"/>
  </defs>

  <!-- ── Outer dark ring ── -->
  <circle cx="100" cy="88"  r="84" fill="none" stroke="#08205a" stroke-width="2"/>
  <!-- ── Background circle ── -->
  <circle cx="100" cy="88"  r="82" fill="url(#bg)"/>
  <!-- ── Inner white glow ring ── -->
  <circle cx="100" cy="88"  r="79" fill="none" stroke="white" stroke-width="2" opacity="0.55"/>

  <!-- ═══ GOLD TUBES (8 cylinders, bar-chart heights) ═══ -->
  <!-- tube helper: body + top-cap + top-hollow -->
  <!-- 1 -->
  <rect  x="26"  y="78"  width="12" height="30"  fill="url(#gold)"/>
  <ellipse cx="32"  cy="78"  rx="6"   ry="3"   fill="url(#goldT)"/>
  <ellipse cx="32"  cy="108" rx="6"   ry="3"   fill="url(#goldB)"/>
  <ellipse cx="32"  cy="78"  rx="3.2" ry="1.5" fill="#200800" opacity=".75"/>
  <!-- 2 -->
  <rect  x="40"  y="66"  width="13" height="42"  fill="url(#gold)"/>
  <ellipse cx="46"  cy="66"  rx="6.5" ry="3.2" fill="url(#goldT)"/>
  <ellipse cx="46"  cy="108" rx="6.5" ry="3.2" fill="url(#goldB)"/>
  <ellipse cx="46"  cy="66"  rx="3.5" ry="1.6" fill="#200800" opacity=".75"/>
  <!-- 3 -->
  <rect  x="55"  y="52"  width="14" height="56"  fill="url(#gold)"/>
  <ellipse cx="62"  cy="52"  rx="7"   ry="3.5" fill="url(#goldT)"/>
  <ellipse cx="62"  cy="108" rx="7"   ry="3.5" fill="url(#goldB)"/>
  <ellipse cx="62"  cy="52"  rx="3.8" ry="1.8" fill="#200800" opacity=".75"/>
  <!-- 4 tallest -->
  <rect  x="71"  y="40"  width="15" height="68"  fill="url(#gold)"/>
  <ellipse cx="78"  cy="40"  rx="7.5" ry="3.8" fill="url(#goldT)"/>
  <ellipse cx="78"  cy="108" rx="7.5" ry="3.8" fill="url(#goldB)"/>
  <ellipse cx="78"  cy="40"  rx="4"   ry="2"   fill="#200800" opacity=".75"/>
  <!-- 5 -->
  <rect  x="88"  y="46"  width="14" height="62"  fill="url(#gold)"/>
  <ellipse cx="95"  cy="46"  rx="7"   ry="3.5" fill="url(#goldT)"/>
  <ellipse cx="95"  cy="108" rx="7"   ry="3.5" fill="url(#goldB)"/>
  <ellipse cx="95"  cy="46"  rx="3.8" ry="1.8" fill="#200800" opacity=".75"/>
  <!-- 6 -->
  <rect  x="104" y="57"  width="13" height="51"  fill="url(#gold)"/>
  <ellipse cx="110" cy="57"  rx="6.5" ry="3.2" fill="url(#goldT)"/>
  <ellipse cx="110" cy="108" rx="6.5" ry="3.2" fill="url(#goldB)"/>
  <ellipse cx="110" cy="57"  rx="3.5" ry="1.6" fill="#200800" opacity=".75"/>
  <!-- 7 -->
  <rect  x="119" y="68"  width="12" height="40"  fill="url(#gold)"/>
  <ellipse cx="125" cy="68"  rx="6"   ry="3"   fill="url(#goldT)"/>
  <ellipse cx="125" cy="108" rx="6"   ry="3"   fill="url(#goldB)"/>
  <ellipse cx="125" cy="68"  rx="3.2" ry="1.5" fill="#200800" opacity=".75"/>
  <!-- 8 short right -->
  <rect  x="133" y="80"  width="11" height="28"  fill="url(#gold)"/>
  <ellipse cx="138" cy="80"  rx="5.5" ry="2.8" fill="url(#goldT)"/>
  <ellipse cx="138" cy="108" rx="5.5" ry="2.8" fill="url(#goldB)"/>
  <ellipse cx="138" cy="80"  rx="3"   ry="1.4" fill="#200800" opacity=".75"/>

  <!-- ═══ BLUE GROWTH ARROW ═══ -->
  <polyline points="28,104 50,90 75,78 100,62 128,44 155,28"
    stroke="#0a2060" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".35"/>
  <polyline points="28,104 50,90 75,78 100,62 128,44 155,28"
    stroke="url(#arr)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="28,104 50,90 75,78 100,62 128,44 155,28"
    stroke="white" stroke-width="1.2" fill="none" opacity=".45"/>
  <polygon points="155,28 144,34 149,44" fill="url(#arr)" stroke="white" stroke-width=".8"/>

  <!-- ═══ BOWL / BASE ═══ -->
  <path d="M 20,112 Q 100,140 180,112 Q 150,128 100,132 Q 50,128 20,112 Z"
    fill="url(#bowl)" opacity=".9"/>
  <path d="M 21,111 Q 100,138 179,111"
    stroke="#5090ff" stroke-width="1.8" fill="none" opacity=".7"/>
  <path d="M 21,111 Q 100,138 179,111"
    stroke="white"   stroke-width=".7" fill="none" opacity=".4"/>

  <!-- ═══ LEFT FIGURE — thumbs up ═══ -->
  <!-- body -->
  <ellipse cx="68" cy="126" rx="16" ry="22" fill="url(#blue1)"/>
  <ellipse cx="62" cy="118" rx="7"  ry="10" fill="url(#blue2)" opacity=".3"/>
  <!-- head -->
  <circle  cx="68" cy="104" r="15"  fill="url(#blue2)"/>
  <circle  cx="62" cy="99"  r="6"   fill="white" opacity=".2"/>
  <!-- eyes closed happy -->
  <path d="M 63,103 Q 65.5,100 68,103" stroke="#08145a" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <path d="M 70,103 Q 72.5,100 75,103" stroke="#08145a" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- smile -->
  <path d="M 62,109 Q 68,115 74,109" stroke="#08145a" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <!-- cheeks -->
  <ellipse cx="59" cy="108" rx="4" ry="2.5" fill="#ff7777" opacity=".3"/>
  <ellipse cx="77" cy="108" rx="4" ry="2.5" fill="#ff7777" opacity=".3"/>
  <!-- left arm up (thumb) -->
  <ellipse cx="48" cy="116" rx="7" ry="12" fill="url(#blue1)" transform="rotate(-30,48,116)"/>
  <circle  cx="41" cy="107" r="7"  fill="url(#blue2)"/>
  <!-- thumb up shape -->
  <rect x="37" y="97" width="6" height="11" rx="3" fill="url(#blue2)"/>
  <rect x="38" y="98" width="2" height="5"  rx="1" fill="white" opacity=".3"/>
  <!-- right arm (shake) -->
  <ellipse cx="84" cy="128" rx="6" ry="11" fill="url(#blue1)" transform="rotate(25,84,128)"/>

  <!-- ═══ RIGHT FIGURE — tie, shake ═══ -->
  <!-- body -->
  <ellipse cx="132" cy="126" rx="16" ry="22" fill="url(#blue1)"/>
  <ellipse cx="126" cy="118" rx="7"  ry="10" fill="url(#blue2)" opacity=".3"/>
  <!-- tie -->
  <polygon points="132,116 129,122 132,142 135,122" fill="#1030a0"/>
  <polygon points="129,116 135,116 134,122 130,122" fill="#08185a"/>
  <!-- head -->
  <circle  cx="132" cy="104" r="15"  fill="url(#blue2)"/>
  <circle  cx="126" cy="99"  r="6"   fill="white" opacity=".2"/>
  <!-- eyes -->
  <path d="M 127,103 Q 129.5,100 132,103" stroke="#08145a" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <path d="M 134,103 Q 136.5,100 139,103" stroke="#08145a" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- smile -->
  <path d="M 126,109 Q 132,115 138,109" stroke="#08145a" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <!-- cheeks -->
  <ellipse cx="123" cy="108" rx="4" ry="2.5" fill="#ff7777" opacity=".3"/>
  <ellipse cx="141" cy="108" rx="4" ry="2.5" fill="#ff7777" opacity=".3"/>
  <!-- left arm (shake) -->
  <ellipse cx="116" cy="128" rx="6" ry="11" fill="url(#blue1)" transform="rotate(-25,116,128)"/>
  <!-- right arm -->
  <ellipse cx="152" cy="116" rx="7" ry="12" fill="url(#blue1)" transform="rotate(30,152,116)"/>

  <!-- ═══ HANDSHAKE ═══ -->
  <circle  cx="93"  cy="136" r="7.5" fill="url(#blue2)"/>
  <circle  cx="107" cy="136" r="7.5" fill="url(#blue2)"/>
  <ellipse cx="100" cy="136" rx="14" ry="7"  fill="url(#blue1)"/>
  <path d="M 88,133 Q 100,129 112,133" stroke="white" stroke-width=".8" fill="none" opacity=".35"/>

  <!-- ═══ FAB TEXT ═══ -->
  <!-- shadow -->
  <text x="102" y="162" font-family="Arial Black,sans-serif" font-weight="900"
    font-size="32" fill="#06124a" text-anchor="middle" opacity=".3" dx="1.5" dy="1.5">FAB</text>
  <text x="100" y="160" font-family="Arial Black,sans-serif" font-weight="900"
    font-size="32" fill="url(#fabg)" text-anchor="middle">FAB</text>
  <text x="100" y="160" font-family="Arial Black,sans-serif" font-weight="900"
    font-size="32" fill="none" stroke="white" stroke-width=".8" text-anchor="middle" opacity=".45">FAB</text>
  <!-- PAPER TUBE -->
  <text x="100" y="171" font-family="Arial,sans-serif" font-weight="700"
    font-size="7.5" fill="#1040a0" text-anchor="middle" letter-spacing="2.5">PAPER TUBE</text>

  <!-- ═══ CURVED TAGLINE ═══ -->
  <text font-family="Georgia,serif" font-size="6.2" fill="#0a2878"
    font-style="italic" font-weight="600">
    <textPath href="#tagArc" startOffset="4%">
      "Premium and Sustainable Packaging Solutions"
    </textPath>
  </text>

  <!-- bottom outer arc -->
  <path d="M 16,88 A 86,86 0 0,0 184,88"
    fill="none" stroke="#08205a" stroke-width="1.8"/>
</svg>
